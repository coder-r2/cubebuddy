<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="CubeBuddy — a free speedcubing companion: timer, virtual cube, algorithm trainer and CFOP tutorial."
    />
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/cubebuddy/favicon.svg" />
    <title>CubeBuddy</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash (D-021, D-030).
      (function () {
        try {
          var pref = localStorage.getItem('cubebuddy:theme') || 'system';
          var dark =
            pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>CubeBuddy needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
